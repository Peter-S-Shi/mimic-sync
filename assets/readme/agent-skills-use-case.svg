<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Mimic Sync AI-agent skills use case</title><desc id="desc">Shared skill-1, skill-2, and skill-3 are synchronized from one Mimic source into Claude, Codex, and Gemini skill folders while each target keeps its local-only skill.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
<rect width="1600" height="1000" rx="34" fill="url(#bg)"/>
<g font-family="Segoe UI,Arial" fill="#10224d">
<text x="70" y="90" font-size="52" font-weight="800">One source, multiple agent skill folders</text><text x="70" y="138" font-size="24" fill="#566783">Define shared skills once and distribute them without deleting agent-specific content.</text>
<g><rect x="80" y="250" width="420" height="500" rx="30" fill="#fff" stroke="#dbe5f8" stroke-width="2"/></g><text x="290" y="320" text-anchor="middle" font-size="30" font-weight="800">Mimic Skills</text><text x="290" y="353" text-anchor="middle" font-size="20" fill="#315fe8">Source</text>
<path d="M145 390h55l18 18h87v75H145z" fill="#3f6ff0"/><text x="340" y="420" font-size="24">skill-1</text><text x="340" y="480" font-size="24">skill-2</text><text x="340" y="540" font-size="24">skill-3</text><text x="340" y="600" font-size="24">…</text>
<circle cx="560" cy="500" r="12" fill="#fff" stroke="#5079ef" stroke-width="6"/><path d="M500 500h60" stroke="#5079ef" stroke-width="6"/><path d="M572 500C650 500 650 300 725 300" fill="none" stroke="#315fe8" stroke-width="7"/><path d="M572 500H725" fill="none" stroke="#21abc7" stroke-width="7"/><path d="M572 500c78 0 78 200 153 200" fill="none" stroke="#35b96d" stroke-width="7"/>
<g fill="#fff" stroke-width="2"><rect x="725" y="190" width="790" height="220" rx="28" stroke="#d8e3fb"/><rect x="725" y="420" width="790" height="220" rx="28" stroke="#cdeef4"/><rect x="725" y="650" width="790" height="220" rx="28" stroke="#d7efdf"/></g>
<text x="780" y="250" font-size="30" font-weight="800" fill="#315fe8">.claude/skills</text><text x="780" y="480" font-size="30" font-weight="800" fill="#168da3">.codex/skills</text><text x="780" y="710" font-size="30" font-weight="800" fill="#299557">.gemini/skills</text>
<g font-size="20" text-anchor="middle"><g fill="#eef2ff" stroke="#cbd7ff"><rect x="790" y="285" width="120" height="58" rx="14"/><rect x="930" y="285" width="120" height="58" rx="14"/><rect x="1070" y="285" width="120" height="58" rx="14"/></g><g fill="#10224d"><text x="850" y="322">skill-1</text><text x="990" y="322">skill-2</text><text x="1130" y="322">skill-3</text></g>
<g fill="#eafafd" stroke="#c9eef3"><rect x="790" y="515" width="120" height="58" rx="14"/><rect x="930" y="515" width="120" height="58" rx="14"/><rect x="1070" y="515" width="120" height="58" rx="14"/></g><g fill="#10224d"><text x="850" y="552">skill-1</text><text x="990" y="552">skill-2</text><text x="1130" y="552">skill-3</text></g>
<g fill="#ebfaef" stroke="#cdebd7"><rect x="790" y="745" width="120" height="58" rx="14"/><rect x="930" y="745" width="120" height="58" rx="14"/><rect x="1070" y="745" width="120" height="58" rx="14"/></g><g fill="#10224d"><text x="850" y="782">skill-1</text><text x="990" y="782">skill-2</text><text x="1130" y="782">skill-3</text></g></g>
<rect x="1210" y="280" width="155" height="48" rx="24" fill="#eef1ff"/><text x="1288" y="311" text-anchor="middle" font-size="19" font-weight="700" fill="#4b5fe8">Add + Update</text><rect x="1210" y="510" width="155" height="48" rx="24" fill="#eafafd"/><text x="1288" y="541" text-anchor="middle" font-size="19" font-weight="700" fill="#168da3">Add + Update</text><rect x="1210" y="740" width="155" height="48" rx="24" fill="#ebfaef"/><text x="1288" y="771" text-anchor="middle" font-size="19" font-weight="700" fill="#299557">Add Only</text>
<text x="1425" y="255" text-anchor="middle" font-size="18" fill="#6f55d8">Local only</text><text x="1425" y="310" text-anchor="middle" font-size="20">claude-only</text><text x="1425" y="485" text-anchor="middle" font-size="18" fill="#168da3">Local only</text><text x="1425" y="540" text-anchor="middle" font-size="20">codex-only</text><text x="1425" y="715" text-anchor="middle" font-size="18" fill="#299557">Local only</text><text x="1425" y="770" text-anchor="middle" font-size="20">gemini-only</text>
<text x="800" y="930" font-size="24" font-weight="700" fill="#315fe8">Shared content stays consistent. Local agent content stays preserved.</text>
</g></svg>

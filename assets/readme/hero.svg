<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
<title id="title">Mimic Sync hero</title><desc id="desc">One Mimic source synchronizes to three targets with Add Only, Update Only, and Add plus Update while preserving target-only content.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5d78ff"/><stop offset="1" stop-color="#2858e8"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43d7e7"/><stop offset="1" stop-color="#18a8c2"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#76dd92"/><stop offset="1" stop-color="#31b86b"/></linearGradient>
</defs>
<rect width="1600" height="600" rx="34" fill="url(#bg)"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#10224d">
 <text x="68" y="138" font-size="84" font-weight="800">Mimic Sync</text>
 <text x="70" y="198" font-size="31" font-weight="600" fill="#315fe8">Configuration-driven folder sync for Windows</text>
 <text x="70" y="257" font-size="24" fill="#41516f">One shared source → multiple independent targets → per-target sync policies.</text>
 <rect x="70" y="306" width="470" height="76" rx="18" fill="#10224d"/>
 <text x="102" y="354" font-size="26" fill="#ffffff" font-weight="700">Sync smarter. Stay in control.</text>
 <text x="70" y="462" font-size="22" font-weight="600">Windows</text><text x="185" y="462" font-size="22" fill="#a7b4c9">•</text>
 <text x="218" y="462" font-size="22" font-weight="600">Config-driven</text><text x="382" y="462" font-size="22" fill="#a7b4c9">•</text>
 <text x="415" y="462" font-size="22" font-weight="600">Safe by design</text>
</g>
<g><rect x="650" y="155" width="220" height="290" rx="30" fill="#fff" stroke="#d7e3fb" stroke-width="2"/></g>
<path d="M702 225h52l18 18h63v112H702z" fill="url(#blue)"/><rect x="702" y="230" width="133" height="24" rx="8" fill="#7690ff"/>
<path d="M748 284a37 37 0 1 1-10 38" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="M728 313l10 9 8-12" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
<text x="760" y="392" text-anchor="middle" font-family="Segoe UI,Arial" font-size="31" font-weight="800" fill="#10224d">Mimic</text><text x="760" y="426" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" fill="#315fe8">Source</text>
<circle cx="900" cy="300" r="12" fill="#fff" stroke="#4d78f5" stroke-width="6"/>
<path d="M912 300C970 300 970 145 1040 145" fill="none" stroke="#315fe8" stroke-width="7"/><path d="M912 300H1040" fill="none" stroke="#28bad1" stroke-width="7"/><path d="M912 300c58 0 58 155 128 155" fill="none" stroke="#39bd70" stroke-width="7"/>
<g font-family="Segoe UI,Arial">
 <rect x="1040" y="73" width="430" height="140" rx="24" fill="#fff" stroke="#d7e3fb" stroke-width="2"/>
 <path d="M1082 114h42l14 14h56v55h-112z" fill="url(#blue)"/><text x="1220" y="138" font-size="28" font-weight="800" fill="#10224d">A1</text><rect x="1280" y="103" width="150" height="48" rx="24" fill="#eef1ff"/><text x="1355" y="135" text-anchor="middle" font-size="20" font-weight="700" fill="#4b5fe8">Add Only</text>
 <rect x="1040" y="230" width="430" height="140" rx="24" fill="#fff" stroke="#cceff4" stroke-width="2"/>
 <path d="M1082 271h42l14 14h56v55h-112z" fill="url(#cyan)"/><text x="1220" y="295" font-size="28" font-weight="800" fill="#10224d">A2</text><rect x="1280" y="260" width="150" height="48" rx="24" fill="#e9fbfd"/><text x="1355" y="292" text-anchor="middle" font-size="20" font-weight="700" fill="#168da3">Update Only</text>
 <rect x="1040" y="387" width="430" height="140" rx="24" fill="#fff" stroke="#d5f1df" stroke-width="2"/>
 <path d="M1082 428h42l14 14h56v55h-112z" fill="url(#green)"/><text x="1220" y="452" font-size="28" font-weight="800" fill="#10224d">A3</text><rect x="1272" y="417" width="166" height="48" rx="24" fill="#ebfaef"/><text x="1355" y="449" text-anchor="middle" font-size="20" font-weight="700" fill="#249557">Add + Update</text>
</g>
<g font-family="Segoe UI,Arial" font-size="16" font-weight="700">
<rect x="980" y="540" width="190" height="38" rx="19" fill="#eef4ff"/><text x="1075" y="565" text-anchor="middle" fill="#315fe8">Preview before mutation</text>
<rect x="1182" y="540" width="190" height="38" rx="19" fill="#eafafd"/><text x="1277" y="565" text-anchor="middle" fill="#168da3">Target-only preserved</text>
<rect x="1384" y="540" width="170" height="38" rx="19" fill="#ebfaef"/><text x="1469" y="565" text-anchor="middle" fill="#299557">No destructive mirror</text>
</g>
</svg>

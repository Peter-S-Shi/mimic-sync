<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Mimic Sync workflow</title><desc id="desc">Configure source and targets, load JSON, scan read-only, preview the sync plan, confirm, then execute and report.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>
<text x="80" y="95" font-family="Segoe UI,Arial" font-size="50" font-weight="800" fill="#10224d">How Mimic Sync works</text>
<text x="80" y="140" font-family="Segoe UI,Arial" font-size="24" fill="#53647f">A preview-first workflow keeps filesystem changes explicit and reviewable.</text>
<g font-family="Segoe UI,Arial">
<g fill="#fff" stroke="#dbe5f8" stroke-width="2"><rect x="55" y="230" width="225" height="440" rx="26"/><rect x="305" y="230" width="225" height="440" rx="26"/><rect x="555" y="230" width="225" height="440" rx="26"/><rect x="805" y="230" width="225" height="440" rx="26"/><rect x="1055" y="230" width="225" height="440" rx="26"/><rect x="1305" y="230" width="225" height="440" rx="26"/></g>
<g fill="none" stroke="#3f76ec" stroke-width="6" stroke-linecap="round"><path d="M280 450h25"/><path d="M530 450h25"/><path d="M780 450h25"/><path d="M1030 450h25"/><path d="M1280 450h25"/></g>
<g text-anchor="middle" font-size="24" font-weight="800" fill="#fff"><circle cx="168" cy="280" r="28" fill="#4d6df0"/><text x="168" y="289">1</text><circle cx="418" cy="280" r="28" fill="#4d6df0"/><text x="418" y="289">2</text><circle cx="668" cy="280" r="28" fill="#3488e8"/><text x="668" y="289">3</text><circle cx="918" cy="280" r="28" fill="#28accb"/><text x="918" y="289">4</text><circle cx="1168" cy="280" r="28" fill="#31b86b"/><text x="1168" y="289">5</text><circle cx="1418" cy="280" r="28" fill="#31b86b"/><text x="1418" y="289">6</text></g>
<g text-anchor="middle" fill="#10224d"><text x="168" y="350" font-size="28" font-weight="800">Choose</text><text x="168" y="385" font-size="28" font-weight="800">Source + Targets</text><text x="418" y="350" font-size="28" font-weight="800">Load JSON</text><text x="418" y="385" font-size="28" font-weight="800">Config</text><text x="668" y="350" font-size="28" font-weight="800">Read-only</text><text x="668" y="385" font-size="28" font-weight="800">Scan</text><text x="918" y="350" font-size="28" font-weight="800">Sync Plan</text><text x="918" y="385" font-size="28" font-weight="800">Preview</text><text x="1168" y="350" font-size="28" font-weight="800">Confirm</text><text x="1168" y="385" font-size="28" font-weight="800">[Y/n]</text><text x="1418" y="350" font-size="28" font-weight="800">Execute +</text><text x="1418" y="385" font-size="28" font-weight="800">Report</text></g>
<g text-anchor="middle" font-family="Segoe UI,Arial" font-size="46" font-weight="800" fill="#315fe8"><text x="168" y="500">DIR</text><text x="418" y="500">{ }</text><text x="668" y="500">SCAN</text><text x="918" y="500">PLAN</text><text x="1168" y="500">✓</text><text x="1418" y="500">REPORT</text></g>
<g text-anchor="middle" fill="#586a85" font-size="19"><text x="168" y="570">Define one source</text><text x="168" y="598">and one or more targets.</text><text x="418" y="570">Load the config profile</text><text x="418" y="598">with per-target modes.</text><text x="668" y="570">Compare filesystem state</text><text x="668" y="598">without changing files.</text><text x="918" y="570">See exact relative paths</text><text x="918" y="598">for planned changes.</text><text x="1168" y="570">Approve explicitly</text><text x="1168" y="598">before any write.</text><text x="1418" y="570">Apply changes safely</text><text x="1418" y="598">and report results.</text></g>
<rect x="300" y="740" width="450" height="78" rx="20" fill="#edf9f3" stroke="#bde9ce"/><text x="525" y="790" text-anchor="middle" font-size="24" font-weight="700" fill="#248451">No destructive mirror</text><rect x="850" y="740" width="450" height="78" rx="20" fill="#eef4ff" stroke="#cbdcff"/><text x="1075" y="790" text-anchor="middle" font-size="24" font-weight="700" fill="#315fe8">Target-only content preserved</text>
</g></svg>
